# Nginx config for the LedgerLens AI frontend container.
#
# Responsibilities:
#   1. Serve the static frontend (index.html / style.css / app.js / assets/).
#   2. Reverse-proxy all /api/* requests to the backend container so the
#      browser never needs to know the backend's address or port.
#   3. SPA fallback — any path that doesn't match a real file routes to
#      index.html, which lets the frontend JS handle routing itself.

server {
    listen 80;
    server_name _;

    # --- Static frontend ---------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets to reduce transfer size.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;
    gzip_min_length 1024;

    # Long-lived cache for hashed assets; no-cache for index.html itself.
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — routes that don't match a file go to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Backend reverse-proxy ---------------------------------------------
    # The frontend's fetch() calls use relative paths like /api/process,
    # /api/login, etc.  Nginx strips the /api prefix and forwards to the
    # backend uvicorn server.
    #
    # "backend" resolves via Docker Compose's internal DNS — it's the
    # service name defined in docker-compose.yml.
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;

        # Required for LangGraph's SSE / streaming responses.
        proxy_set_header   Connection         "";
        proxy_buffering    off;

        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        # Increase timeouts — invoice processing can take 30–60 s for
        # low-confidence scanned PDFs that go through vision.
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }
}
