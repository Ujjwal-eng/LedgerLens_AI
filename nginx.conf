# Nginx config for the LedgerLens AI frontend container.
#
# Responsibilities:
#   1. Serve the static frontend (index.html / style.css / app.js / assets/).
#   2. Reverse-proxy all /api/* requests to the backend container so the
#      browser never needs to know the backend's address or port.
#   3. SPA fallback — any path that doesn't match a real file routes to
#      index.html, which lets the frontend JS handle routing itself.

server {
    listen 80;
    server_name _;

    # --- Static frontend ---------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets to reduce transfer size.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;
    gzip_min_length 1024;

    # Long-lived cache for hashed assets; no-cache for index.html itself.
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — routes that don't match a file go to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NOTE: the /api/ reverse-proxy block that used to live here has been
    # removed for the Railway deployment. It pointed to "backend:8000",
    # a hostname that only resolves inside Docker Compose's internal
    # network — nginx fails to start if it can't resolve an upstream at
    # boot, which crashed this container on Railway.
    #
    # The frontend (app.js) instead calls the backend directly using
    # window.LEDGERLENS_API_BASE (set in index.html), so this proxy isn't
    # needed here. If you later want to route through nginx again (e.g.
    # using Railway private networking), re-add a location /api/ block
    # pointing at the backend service's actual Railway domain.
}